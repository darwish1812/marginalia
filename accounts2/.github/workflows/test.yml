name: the booklet still opens

# Six faults reached a reader in the week the shell was built, every one found by hand on
# two devices after the fact. This runs on every push so that the next one is found in a
# minute by a machine instead.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only the one browser the suite uses. --with-deps because a bare runner has none of
      # the libraries a headless Chromium expects.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # The report is worth having exactly when the run failed.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
